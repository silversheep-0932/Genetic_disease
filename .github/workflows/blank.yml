    chromosomes += `
        <div class="chromosome sex-chromosome" onclick="selectChromosome('X')">
            <div class="chromosome-number">X</div>
            <div class="chromosome-shape"></div>
        </div>

        <div class="chromosome sex-chromosome" onclick="selectChromosome('Y')">
            <div class="chromosome-number">Y</div>
            <div class="chromosome-shape"></div>
        </div>
    `;

    return `
        <div class="karyo-container">

