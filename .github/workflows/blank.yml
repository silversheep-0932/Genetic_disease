<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧬 유전, 그 가능성의 지도: 유전병 파헤치기 </title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #3b82f6 50%, #8b5cf6 100%);
            --header-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4338ca 100%);
            --accent-glow: 0 0 20px rgba(99, 102, 241, 0.4);
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --warning: #f59e0b;
            --warning-bg: #fffbeb;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 22px;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 16px 32px rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            background: var(--header-gradient);
            color: white;
            padding: 36px 20px;
            text-align: center;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 140%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 60%);
            pointer-events: none;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.05rem;
            opacity: 0.9;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
        }

        .guide-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .guide-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.03);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* Modal styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: white;
            border-radius: var(--radius-lg);
            max-width: 580px;
            width: 100%;
            padding: 28px;
            box-shadow: var(--shadow-lg);
            max-height: 85vh;
            overflow-y: auto;
        }

        .home-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
            margin-top: 10px;
        }

        @media (max-width: 680px) {
            .home-grid {
                grid-template-columns: 1fr;
            }
        }

        .disease-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 26px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .disease-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--primary-gradient);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .disease-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: var(--shadow-lg);
            border-color: #cbd5e1;
        }

        .disease-card:hover::before {
            opacity: 1;
        }

        .disease-card .icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
            display: inline-block;
        }

        .disease-card h2 {
            font-size: 1.3rem;
            color: var(--text-main);
            margin-bottom: 10px;
            font-weight: 800;
        }

        .disease-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 18px;
            flex-grow: 1;
            line-height: 1.55;
        }

        .disease-card .badge {
            align-self: flex-start;
            background: #e0e7ff;
            color: #3730a3;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }

        .btn-back:hover {
            background: #f1f5f9;
            transform: translateX(-3px);
        }

        .detail-header {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 28px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
        }

        .detail-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: #1e1b4b;
            margin-bottom: 8px;
        }

        .detail-desc {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .info-section {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 28px;
            border: 1px solid var(--border);
            margin-bottom: 28px;
            box-shadow: var(--shadow-sm);
        }

        .info-section h3 {
            font-size: 1.25rem;
            color: #312e81;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e7ff;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-item {
            margin-bottom: 18px;
            padding-left: 14px;
            border-left: 4px solid var(--primary);
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-item .num-title {
            font-weight: 800;
            color: var(--text-main);
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .info-item p {
            font-size: 0.94rem;
            color: #334155;
            white-space: pre-line;
            line-height: 1.6;
        }

        /* Navigation action buttons inside detail page */
        .detail-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-top: 24px;
        }

        @media (max-width: 600px) {
            .detail-actions {
                grid-template-columns: 1fr;
            }
        }

        .action-card-btn {
            background: var(--card-bg);
            border: 2px solid #c7d2fe;
            border-radius: var(--radius-lg);
            padding: 22px;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .action-card-btn:hover {
            border-color: var(--primary);
            background: #f5f3ff;
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .action-card-btn h4 {
            font-size: 1.15rem;
            color: var(--primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-card-btn p {
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .quiz-container {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 30px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--primary-gradient);
            width: 0%;
            transition: width 0.3s ease;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .quiz-header h3 {
            font-size: 1.3rem;
            color: #312e81;
        }

        .quiz-step {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.95rem;
        }

        .quiz-question-box {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: var(--radius-md);
            padding: 24px;
            font-size: 1.15rem;
            font-weight: 700;
            min-height: 100px;
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .quiz-options {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn-ox {
            flex: 1;
            padding: 20px;
            font-size: 1.8rem;
            font-weight: 900;
            border-radius: var(--radius-md);
            border: 2px solid var(--border);
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .btn-ox.o-btn:hover:not(:disabled) {
            border-color: var(--success);
            color: var(--success);
            background: var(--success-bg);
            transform: scale(1.02);
        }

        .btn-ox.x-btn:hover:not(:disabled) {
            border-color: var(--danger);
            color: var(--danger);
            background: var(--danger-bg);
            transform: scale(1.02);
        }

        .btn-ox.selected-o {
            border-color: var(--success) !important;
            background: var(--success-bg) !important;
            color: var(--success) !important;
        }

        .btn-ox.selected-x {
            border-color: var(--danger) !important;
            background: var(--danger-bg) !important;
            color: var(--danger) !important;
        }

        .quiz-feedback-banner {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 800;
            min-height: 40px;
            padding: 8px;
            border-radius: var(--radius-sm);
        }

        .report-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 30px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        .report-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--border);
            margin-bottom: 24px;
        }

        .report-header h3 {
            font-size: 1.6rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .score-badge {
            display: inline-block;
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            background: #e0e7ff;
            padding: 8px 24px;
            border-radius: 30px;
            margin-top: 10px;
        }

        .report-item {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 18px;
            margin-bottom: 16px;
        }

        .report-item-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .report-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .report-badge.correct { background: var(--success-bg); color: var(--success); }
        .report-badge.wrong { background: var(--danger-bg); color: var(--danger); }

        .report-details {
            font-size: 0.9rem;
            color: #475569;
            margin-top: 6px;
            line-height: 1.5;
        }

        .calc-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 30px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
        }

        .calc-card h3 {
            font-size: 1.35rem;
            color: #312e81;
            margin-bottom: 12px;
        }

        .calc-intro {
            background: #e0e7ff;
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 0.92rem;
            color: #1e1b4b;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .pedigree-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #f1f5f9;
            padding: 22px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
        }

        .pedigree-row {
            display: flex;
            justify-content: space-around;
            gap: 12px;
            flex-wrap: wrap;
        }

        .pedigree-box {
            background: white;
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: var(--radius-md);
            width: calc(25% - 10px);
            min-width: 140px;
            box-shadow: var(--shadow-sm);
            text-align: center;
        }

        .pedigree-box.parent-box {
            width: calc(45% - 10px);
            min-width: 180px;
            border-top: 4px solid var(--primary);
        }

        .pedigree-box.child-box {
            width: 65%;
            min-width: 220px;
            margin: 0 auto;
            border-top: 4px solid #8b5cf6;
            background: #faf5ff;
        }

        .pedigree-box .title {
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .pedigree-box select {
            width: 100%;
            padding: 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            font-size: 0.88rem;
            background: #fff;
            cursor: pointer;
        }

        .calc-actions {
            display: flex;
            gap: 14px;
            margin-bottom: 20px;
        }

        .btn-calc {
            flex: 2;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: opacity 0.2s;
        }

        .btn-calc:hover {
            opacity: 0.92;
        }

        .btn-reset {
            flex: 1;
            background: white;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 14px;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
        }

        .btn-reset:hover {
            background: #f1f5f9;
        }

        .calc-result {
            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-top: 20px;
        }

        .calc-result h4 {
            color: #312e81;
            margin-bottom: 12px;
            font-size: 1.15rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .res-case {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-bottom: 12px;
        }

        .res-case-title {
            font-weight: 800;
            font-size: 0.95rem;
            color: #4338ca;
            margin-bottom: 8px;
        }

        .res-stats {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }

        .stat-pill {
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 0.82rem;
            font-weight: 800;
        }

        .stat-affected { background: var(--danger-bg); color: var(--danger); }
        .stat-carrier { background: var(--warning-bg); color: var(--warning); }
        .stat-normal { background: var(--success-bg); color: var(--success); }

        .res-explain {
            font-size: 0.9rem;
            color: #475569;
            margin-top: 8px;
            line-height: 1.5;
            background: #f8fafc;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
        }

        .miller-notice-box {
            background: #fffbe2;
            border: 1px solid #fde68a;
            border-radius: var(--radius-lg);
            padding: 26px;
            box-shadow: var(--shadow-sm);
        }

        .miller-notice-box h3 {
            color: #b45309;
            font-size: 1.2rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .miller-notice-box p {
            font-size: 0.95rem;
            color: #78350f;
            line-height: 1.6;
        }

        footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-muted);
            padding: 20px;
            border-top: 1px solid var(--border);
        }
        /* =========================
           가상 핵형 분석실
        ========================= */

        .lab-card {
            margin-top: 28px;
            padding: 26px;
            border-radius: 20px;
            background: linear-gradient(135deg, #f5f3ff, #eff6ff);
            border: 1px solid #ddd6fe;
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.08);
            cursor: pointer;
            transition: 0.2s;
        }

        .lab-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(79, 70, 229, 0.14);
        }

        .lab-card h3 {
            margin: 0 0 8px;
            color: #312e81;
        }

        .lab-card p {
            margin: 0;
            color: #64748b;
            line-height: 1.6;
        }

        .karyo-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .karyo-intro {
            background: white;
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 5px 18px rgba(0,0,0,0.05);
        }

        .karyo-step {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .chromosome-board {
            background: #111827;
            border-radius: 20px;
            padding: 24px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .chromosome-board h3 {
            margin-top: 0;
        }

        .chromosome-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 14px;
            margin-top: 22px;
        }

        .chromosome {
            min-height: 82px;
            background: #1f2937;
            border: 2px solid #374151;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .chromosome:hover {
            border-color: #a5b4fc;
            transform: translateY(-3px);
        }

        .chromosome.selected {
            border-color: #818cf8;
            background: #312e81;
        }

        .chromosome-number {
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .chromosome-shape {
            position: relative;
            width: 20px;
            height: 48px;
        }

        .chromosome-shape::before,
        .chromosome-shape::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 27px;
            background: #f8fafc;
            border-radius: 8px;
            top: 0;
        }

        .chromosome-shape::before {
            left: 0;
            transform: rotate(25deg);
        }

        .chromosome-shape::after {
            right: 0;
            transform: rotate(-25deg);
        }

        .sex-chromosome {
            grid-column: span 2;
        }

        .karyo-message {
            margin-top: 20px;
            padding: 18px;
            border-radius: 14px;
            background: #f8fafc;
            color: #334155;
            line-height: 1.7;
            min-height: 30px;
        }

        .karyo-message.success {
            background: #ecfdf5;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .karyo-message.warning {
            background: #fff7ed;
            color: #9a3412;
            border: 1px solid #fed7aa;
        }

        .chromosome-detail {
            display: none;
            margin-top: 22px;
            background: white;
            color: #1e293b;
            border-radius: 18px;
            padding: 25px;
            animation: fadeIn 0.25s ease;
        }

        .chromosome-detail.show {
            display: block;
        }

        .chromosome-large {
            position: relative;
            width: 100px;
            height: 230px;
            margin: 20px auto;
        }

        .chromosome-large .arm {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 38px;
            background: #6366f1;
            border-radius: 22px;
        }

        .chromosome-large .short-arm {
            top: 0;
            height: 105px;
        }

        .chromosome-large .long-arm {
            bottom: 0;
            height: 110px;
        }

        .gene-marker {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
