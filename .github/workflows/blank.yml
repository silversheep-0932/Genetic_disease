            quizList: [],
            quizIndex: 0,
            quizAnswers: [], // { question, userAns, correctAns, isCorrect, exp }
            isAnswering: false,
            // Pedigree State
            pedigree: {
                mgf: 'unaffected', mgm: 'unaffected',
                pgf: 'unaffected', pgm: 'unaffected',
                mot: 'unaffected', fat: 'unaffected',
                childSex: 'male'
            }
        };

        function openModal() { document.getElementById('guideModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('guideModal').style.display = 'none'; }

        // Fisher-Yates Shuffle
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Navigation Controllers
        function goHome() {
            state.view = 'home';
            state.currentDiseaseId = null;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goDetail(diseaseId) {
            state.view = 'detail';
            state.currentDiseaseId = diseaseId;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function startQuiz(diseaseId) {
            state.view = 'quiz';
            state.currentDiseaseId = diseaseId;
            state.quizList = shuffleArray(diseaseData[diseaseId].quiz);
            state.quizIndex = 0;
            state.quizAnswers = [];
            state.isAnswering = false;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function startCalc(diseaseId) {
            state.view = 'calc';
            state.currentDiseaseId = diseaseId;
            state.pedigree = {
                mgf: 'unaffected', mgm: 'unaffected',
                pgf: 'unaffected', pgm: 'unaffected',
                mot: 'unaffected', fat: 'unaffected',
                childSex: 'male'
            };
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function render() {
            const app = document.getElementById('app');
            if (state.view === 'home') {
                app.innerHTML = renderHome();
            } else if (state.view === 'detail') {
                app.innerHTML = renderDetail(state.currentDiseaseId);
            } else if (state.view === 'quiz') {
                app.innerHTML = renderQuizView(state.currentDiseaseId);
            } else if (state.view === 'calc') {
                app.innerHTML = renderCalcView(state.currentDiseaseId);
	    } else if (state.view === 'karyotype') {
                app.innerHTML = renderKaryotype();
            }
        }

/* =========================
   가상 핵형 분석실
========================= */

function startKaryotype() {
    state.view = 'karyotype';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

