        function updatePedigree(key, val) { state.pedigree[key] = val; }
        function resetPedigree(diseaseId) {
            state.pedigree = {
                mgf: 'unaffected', mgm: 'unaffected',
                pgf: 'unaffected', pgm: 'unaffected',
                mot: 'unaffected', fat: 'unaffected',
                childSex: 'male'
            };
            render();
        }

        function calculateGenetics(diseaseId) {
            const container = document.getElementById('calcResultContainer');
            if (!container) return;

            const p = state.pedigree;
            let html = '';

            if (diseaseId === 'sma') html = solveSMA(p);
            else if (diseaseId === 'oi') html = solveOI(p);
            else if (diseaseId === 'ald') html = solveALD(p);

            container.innerHTML = html;
        }


        function genotypeOptionsByPhenotype(phenotype, diseaseType) {
            if (diseaseType === 'recessive') {
                if (phenotype === 'affected') return ['aa'];
                if (phenotype === 'unaffected') return ['AA', 'Aa'];
                return ['AA', 'Aa', 'aa'];
            }
            if (diseaseType === 'dominant') {
                if (phenotype === 'affected') return ['AA', 'Aa'];
                if (phenotype === 'unaffected') return ['aa'];
                return ['AA', 'Aa', 'aa'];
            }
            return [];
        }

        function offspringAutosomal(g1, g2) {
            const a1 = g1.split('');
            const a2 = g2.split('');
            const counts = {};
            [a1[0] + a2[0], a1[0] + a2[1], a1[1] + a2[0], a1[1] + a2[1]].forEach(g => {
                const sorted = g.split('').sort((a,b) => a === 'A' ? -1 : 1).join('');
                counts[sorted] = (counts[sorted] || 0) + 25;
            });
            return counts;
        }

        /*
         * 조부모의 표현형 → 부모의 가능한 유전자형을 역으로 추론한다.
         * 중요한 점: '정상'이라고 해서 열성 유전에서는 AA로 확정되지 않는다.
         * 따라서 확정할 수 없는 경우 가능한 유전자형을 모두 남긴다.
         */
        function inferAutosomalParent(gp1Phenotype, gp2Phenotype, parentPhenotype, diseaseType) {
            const gp1 = genotypeOptionsByPhenotype(gp1Phenotype, diseaseType);
            const gp2 = genotypeOptionsByPhenotype(gp2Phenotype, diseaseType);
            const allowedParent = new Set(genotypeOptionsByPhenotype(parentPhenotype, diseaseType));
            const possible = new Set();

            gp1.forEach(g1 => {
                gp2.forEach(g2 => {
                    const children = offspringAutosomal(g1, g2);
                    Object.keys(children).forEach(childGenotype => {
                        if (allowedParent.has(childGenotype)) possible.add(childGenotype);
                    });
                });
            });

            return Array.from(possible);
        }

        function autosomalCross(g1, g2, diseaseType) {
            const raw = offspringAutosomal(g1, g2);
            const genotype = {};
            Object.keys(raw).forEach(g => genotype[g] = raw[g]);

            let affected = 0, carrier = 0, normal = 0;

            Object.entries(genotype).forEach(([g, pct]) => {
                if (diseaseType === 'recessive') {
                    if (g === 'aa') affected += pct;
                    else if (g === 'Aa') carrier += pct;
                    else normal += pct;
                } else {
                    if (g === 'AA' || g === 'Aa') affected += pct;
                    else normal += pct;
                }
            });

            const genotypeText = Object.entries(genotype)
                .map(([g,pct]) => `${g} ${pct}%`)
                .join(', ');

            let explanation = `${g1} × ${g2} → 자녀의 가능한 유전자형은 ${genotypeText}입니다. `;
            if (diseaseType === 'recessive') {
                explanation += `aa일 때 질환이 나타나므로 발병 ${affected}%, 보인자 ${carrier}%, 정상(비보인자) ${normal}%입니다.`;
            } else {
                explanation += `AA 또는 Aa이면 우성 형질이 나타나므로 발병 ${affected}%, 정상(aa) ${normal}%입니다.`;
            }

            return { m:g1, f:g2, aff:affected, car:carrier, nor:normal, explanation };
        }

        function solveSMA(p) {
            const motGenos = inferAutosomalParent(p.mgf, p.mgm, p.mot, 'recessive');
            const fatGenos = inferAutosomalParent(p.pgf, p.pgm, p.fat, 'recessive');

            const results = [];
            motGenos.forEach(m => {
                fatGenos.forEach(f => results.push(autosomalCross(m, f, 'recessive')));
            });

            const explain = [];
            explain.push("SMA는 상염색체 열성으로 단순화했습니다. 환자는 aa, 정상인은 AA 또는 Aa입니다.");
            explain.push("정상 표현형만으로는 AA와 Aa를 구분할 수 있으므로, 조부모 정보로 가능한 유전자형을 먼저 좁힌 뒤 부모 조합별로 자녀 확률을 계산합니다.");
            if (motGenos.length === 1) explain.push(`어머니의 가능한 유전자형이 ${motGenos[0]}로 좁혀졌습니다.`);
            else explain.push(`어머니의 가능한 유전자형: ${motGenos.join(', ')}`);
            if (fatGenos.length === 1) explain.push(`아버지의 가능한 유전자형이 ${fatGenos[0]}로 좁혀졌습니다.`);
            else explain.push(`아버지의 가능한 유전자형: ${fatGenos.join(', ')}`);

            return formatOutput("척수성 근위축증(SMA)", motGenos, fatGenos, results, explain.join('<br>'));
        }

        function solveOI(p) {
            // 우성 유전이므로 AA와 Aa 모두 질환 표현형으로 취급한다.
            const motGenos = inferAutosomalParent(p.mgf, p.mgm, p.mot, 'dominant');
            const fatGenos = inferAutosomalParent(p.pgf, p.pgm, p.fat, 'dominant');

            const results = [];
            motGenos.forEach(m => {
                fatGenos.forEach(f => results.push(autosomalCross(m, f, 'dominant')));
            });

            const explain = [];
            explain.push("OI 1형은 이 학습용 계산기에서 상염색체 우성으로 단순화했습니다. AA 또는 Aa이면 질환 표현형, aa이면 정상 표현형입니다.");
            explain.push("따라서 '질병 있음'만으로는 AA와 Aa를 항상 구분할 수 없습니다. 조부모와 부모의 표현형을 함께 확인하여 가능한 유전자형을 남깁니다.");
            if (motGenos.length === 1) explain.push(`어머니의 가능한 유전자형이 ${motGenos[0]}로 좁혀졌습니다.`);
            else explain.push(`어머니의 가능한 유전자형: ${motGenos.join(', ')}`);
            if (fatGenos.length === 1) explain.push(`아버지의 가능한 유전자형이 ${fatGenos[0]}로 좁혀졌습니다.`);
            else explain.push(`아버지의 가능한 유전자형: ${fatGenos.join(', ')}`);

            return formatOutput("골형성부전증 1형(OI)", motGenos, fatGenos, results, explain.join('<br>'));
        }

        function xGenotypeOptions(phenotype, sex) {
            if (sex === 'male') {
                if (phenotype === 'affected') return ['XᵃY'];
                if (phenotype === 'unaffected') return ['XᴺY'];
                return ['XᴺY', 'XᵃY'];
            } else {
                if (phenotype === 'affected') return ['XᵃXᵃ'];
                if (phenotype === 'unaffected') return ['XᴺXᴺ', 'XᴺXᵃ'];
                return ['XᴺXᴺ', 'XᴺXᵃ', 'XᵃXᵃ'];
            }
        }

        function xLinkedOffspring(parent1, parent2, childSex) {
            // parent1 = mother(XX), parent2 = father(XY)
            const result = {};
            const maternal = parent1 === 'XᴺXᴺ' ? ['Xᴺ'] :
                             parent1 === 'XᴺXᵃ' ? ['Xᴺ','Xᵃ'] : ['Xᵃ'];
            const paternal = parent2 === 'XᴺY' ? (childSex === 'female' ? ['Xᴺ'] : ['Y']) :
                             (childSex === 'female' ? ['Xᵃ'] : ['Y']);

            maternal.forEach(mx => {
                paternal.forEach(px => {
                    const g = childSex === 'female' ? [mx, px].sort().join('') : mx + px;
                    result[g] = (result[g] || 0) + 100 / (maternal.length * paternal.length);
                });
            });
            return result;
        }

        function inferALDMother(mgfPhenotype, mgmPhenotype, motherPhenotype) {
            const mgf = xGenotypeOptions(mgfPhenotype, 'male');
            const mgm = xGenotypeOptions(mgmPhenotype, 'female');
            const allowed = new Set(xGenotypeOptions(motherPhenotype, 'female'));
            const possible = new Set();

            mgf.forEach(gf => {
                mgm.forEach(gm => {
                    // 딸은 아버지의 X와 어머니의 X를 하나씩 받는다.
                    const fatherX = gf === 'XᵃY' ? 'Xᵃ' : 'Xᴺ';
                    const motherXs = gm === 'XᴺXᴺ' ? ['Xᴺ'] :
                                     gm === 'XᴺXᵃ' ? ['Xᴺ','Xᵃ'] : ['Xᵃ'];
                    motherXs.forEach(mx => {
                        const child = [fatherX, mx].sort().join('');
                        if (allowed.has(child)) possible.add(child);
                    });
                });
            });
            return Array.from(possible);
        }

        function inferALDFather(pgmPhenotype, fatherPhenotype) {
            // 아버지는 X를 친할머니에게서, Y를 친할아버지에게서 받는다.
            // 따라서 친할아버지의 X는 아버지의 X에 영향을 주지 않는다.
            const pgm = xGenotypeOptions(pgmPhenotype, 'female');
            const allowed = new Set(xGenotypeOptions(fatherPhenotype, 'male'));
            const possible = new Set();

            pgm.forEach(gm => {
                const xs = gm === 'XᴺXᴺ' ? ['Xᴺ'] :
                           gm === 'XᴺXᵃ' ? ['Xᴺ','Xᵃ'] : ['Xᵃ'];
                xs.forEach(x => {
                    const father = x + 'Y';
                    if (allowed.has(father)) possible.add(father);
                });
            });
            return Array.from(possible);
        }

        function aldCross(mother, father, childSex) {
            const raw = xLinkedOffspring(mother, father, childSex);
            let affected = 0, carrier = 0, normal = 0;

            Object.entries(raw).forEach(([g,pct]) => {
                if (childSex === 'male') {
                    if (g === 'XᵃY') affected += pct;
                    else normal += pct;
                } else {
                    if (g === 'XᵃXᵃ') affected += pct;
                    else if (g === 'XᴺXᵃ') carrier += pct;
                    else normal += pct;
                }
            });

            const genotypeText = Object.entries(raw)
                .map(([g,pct]) => `${g} ${pct}%`)
                .join(', ');

            let explanation = `${mother} × ${father}에서 ${childSex === 'male' ? '아들은 아버지에게서 Y를 받고 어머니에게서 X 하나를 받으므로' : '딸은 아버지와 어머니에게서 X를 하나씩 받으므로'} `;
            explanation += `가능한 유전자형은 ${genotypeText}입니다. `;
            if (childSex === 'male') explanation += `XᵃY이면 발병하므로 발병 ${affected}%, 정상 ${normal}%입니다.`;
            else explanation += `XᵃXᵃ이면 발병하고 XᴺXᵃ이면 보인자이므로 발병 ${affected}%, 보인자 ${carrier}%, 정상 ${normal}%입니다.`;

            return { m:mother, f:father, aff:Math.round(affected), car:Math.round(carrier), nor:Math.round(normal), explanation };
        }

        function solveALD(p) {
            const motGenos = inferALDMother(p.mgf, p.mgm, p.mot);
            const fatGenos = inferALDFather(p.pgm, p.fat);
            const results = [];
            const childSex = p.childSex === 'female' ? 'female' : 'male';

            motGenos.forEach(m => {
                fatGenos.forEach(f => results.push(aldCross(m, f, childSex)));
            });

            const explain = [];
            explain.push("X-ALD는 X연관 열성으로 단순화했습니다. 남성은 X염색체가 하나뿐이어서 XᵃY이면 발병하고, 여성은 XᵃXᵃ이면 발병합니다.");
            explain.push("딸은 아버지에게서 X를, 아들은 아버지에게서 Y를 받습니다. 따라서 자녀의 성별에 따라 확률 계산이 달라집니다.");
            explain.push("또한 아버지의 X염색체는 친할머니에게서 오므로, 친할아버지는 아버지의 X연관 유전자형 추론에는 직접 기여하지 않습니다.");
            if (motGenos.length === 1) explain.push(`어머니의 가능한 유전자형이 ${motGenos[0]}로 좁혀졌습니다.`);
            else explain.push(`어머니의 가능한 유전자형: ${motGenos.join(', ')}`);
            if (fatGenos.length === 1) explain.push(`아버지의 가능한 유전자형이 ${fatGenos[0]}로 좁혀졌습니다.`);
            else explain.push(`아버지의 가능한 유전자형: ${fatGenos.join(', ')}`);

            return formatOutput("X연관 부신백질이영양증(X-ALD)", motGenos, fatGenos, results, explain.join('<br>'));
        }

        function formatOutput(title, motGenos, fatGenos, results, explainStr) {
            const isMultiple = results.length > 1;

            return `
                <div class="calc-result">
                    <h4>📊 ${title} 유전 확률 결과</h4>
                    <div style="font-size:0.88rem; color:var(--primary); margin-bottom:12px; line-height:1.65;">
                        ${explainStr}
                    </div>

                    ${isMultiple ? `
                        <p style="font-size:0.88rem; color:var(--danger); font-weight:700; margin-bottom:12px;">
                            ⚠️ 현재 입력만으로 부모의 유전자형을 하나로 확정할 수 없어, 가능한 유전자형 조합을 각각 계산했습니다. 어느 한 Case가 더 가능하다고 임의로 가정하지 않았습니다.
                        </p>
                    ` : `
                        <p style="font-size:0.88rem; color:var(--success); font-weight:700; margin-bottom:12px;">
                            ✓ 현재 입력으로 부모의 유전자형 조합이 하나로 좁혀졌습니다.
                        </p>
                    `}

                    ${results.length === 0 ? `
                        <div class="res-case">
                            <div class="res-explain">⚠️ 입력한 표현형 조합은 해당 유전 방식의 멘델 유전 규칙과 양립하지 않습니다. 입력값을 다시 확인해 주세요.</div>
                        </div>
                    ` : results.map((r, idx) => `
                        <div class="res-case">
                            <div class="res-case-title">Case ${idx + 1}: 어머니 (${r.m}) × 아버지 (${r.f})</div>
                            <div class="res-stats">
                                <span class="stat-pill stat-affected">질환 발병 확률: ${r.aff}%</span>
                                ${r.car > 0 ? `<span class="stat-pill stat-carrier">보인자 확률: ${r.car}%</span>` : ''}
                                <span class="stat-pill stat-normal">정상(비발병) 확률: ${r.nor}%</span>
                            </div>
                            <div class="res-explain">
                                💡 <b>왜 이렇게 계산되나요?</b> ${r.explanation}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }


                window.onload = function() {
            render();
        };
    </script>
</body>
</html>
