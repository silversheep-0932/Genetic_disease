function selectChromosome(number) {

    const message = document.getElementById('karyoMessage');
    const detail = document.getElementById('chromosomeDetail');
    const title = document.getElementById('chromosomeDetailTitle');
    const text = document.getElementById('chromosomeDetailText');

    document.querySelectorAll('.chromosome')
        .forEach(el => el.classList.remove('selected'));

    const chromosomes = document.querySelectorAll('.chromosome');

    if (number >= 1 && number <= 22) {
        chromosomes[number - 1].classList.add('selected');
    }

    if (number === 17) {

        message.className = 'karyo-message success';

        message.innerHTML = `
            🎯 <b>17번 염색체를 찾았습니다!</b><br>
            이제 염색체를 확대하여 특정 위치를 분석해 보세요.
        `;

        detail.classList.add('show');

        title.innerHTML = '🧬 17번 염색체 확대 분석';

        text.innerHTML = `
            밀러-디커 증후군은
            <b>17번 염색체 단완(p)의 17p13.3 영역 결실</b>과
            관련됩니다.<br><br>

            아래 염색체에서
            <b>빨간색으로 표시된 영역</b>을 클릭해 보세요.
        `;

    } else {

        message.className = 'karyo-message warning';

        message.innerHTML = `
            🔎 ${number}번 염색체를 선택했습니다.<br>
            이번 미션에서 찾아야 하는 염색체는
            <b>17번 염색체</b>입니다.
        `;

        detail.classList.remove('show');
    }
}


